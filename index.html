<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo Divers 3D Alpha</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050a12; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 30px; left: 30px; color: #00ffcc; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="ui">
        HALO DIVERS: 3D HARDWARE INTERFACE LIVE<br>
        <span id="status" style="color: #00ffcc;">✅ 3D ENGINE INITIALIZED</span><br>
        <span id="debug" style="color: #8fa0ba; font-size: 16px;">Move Left Stick to maneuver. Press Right Bumper (RB) to fire!</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <!-- Load Three.js 3D Library Safely via CDN -->
    <script src="https://cloudflare.com"></script>

    <script>
        // ==========================================
        // 1. 3D RENDER ENGINE SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a12);
        scene.fog = new THREE.FogExp2(0x050a12, 0.015); // Add atmosphere fog

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // ==========================================
        // 2. HARDWARE LIGHTING (Crucial for Xbox One S compatibility)
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0x223344, 1.5); // Global soft tint
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0x00ffcc, 2.0); // Bright tactical overhead light
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // ==========================================
        // 3. 3D GAME WORLD OBJECTS
        // ==========================================
        // Grid Terrain floor
        const gridHelper = new THREE.GridHelper(200, 100, 0x00ffcc, 0x1a2636);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // 3D Player Character (Representing an ODST Armor Block)
        const playerGeo = new THREE.BoxGeometry(1.2, 2.0, 1.2);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.4, metalness: 0.2 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1.0, 0); // Stand perfectly on ground level
        scene.add(player);

        // Third-Person Camera Offset Config
        const cameraOffset = new THREE.Vector3(0, 5, 8); 

        // Projectiles sandbox containers
        const projectiles = [];
        let canFire = true;
        let lastMoveDir = new THREE.Vector3(0, 0, -1); // Default shooting forward vector

        // ==========================================
        // 4. HARDWARE INPUT PROCESSOR
        // ==========================================
        function processHardwareControls() {
            const gamepads = navigator.getGamepads();
            
            for (let i = 0; i < gamepads.length; i++) {
                const pad = gamepads[i];
                if (!pad) continue;

                // --- MANEUVER LOOPS (LEFT STICK) ---
                if (pad.axes && pad.axes.length >= 2) {
                    const stickX = pad.axes[0] || 0;
                    const stickY = pad.axes[1] || 0;

                    if (Math.abs(stickX) > 0.15 || Math.abs(stickY) > 0.15) {
                        // Apply movement directly along the 3D space axes (X and Z floor coordinates)
                        player.position.x += stickX * 0.15;
                        player.position.z += stickY * 0.15;

                        // Calculate and store rotation vector orientation based on direction
                        lastMoveDir.set(stickX, 0, stickY).normalize();
                        
                        // Rotate player mesh smoothly to face the heading direction
                        const targetAngle = Math.atan2(stickX, stickY);
                        player.rotation.y = targetAngle;
                    }
                }

                // --- WEAPON TRIGGERS (RIGHT BUMPER) ---
                if (pad.buttons && pad.buttons.length > 5) {
                    const rbButton = pad.buttons[5]; // Standard hardware mapping for RB
                    if (rbButton && rbButton.pressed && canFire) {
                        spawn3DProjectile();
                    }
                }
            }
        }

        // ==========================================
        // 5. 3D PROJECTILE WEAPON PHYSICS
        // ==========================================
        const boltGeo = new THREE.SphereGeometry(0.2, 8, 8);
        const boltMat = new THREE.MeshBasicMaterial({ color: 0x3399ff }); // Glowing plasma blue bullet

        function spawn3DProjectile() {
            canFire = false;

            const projectileMesh = new THREE.Mesh(boltGeo, boltMat);
            // Spawn bullet right at weapon chest position
            projectileMesh.position.copy(player.position);
            projectileMesh.position.y += 0.5; 
            scene.add(projectileMesh);

            projectiles.push({
                mesh: projectileMesh,
                velocity: lastMoveDir.clone().multiplyScalar(0.6), // Set velocity multiplier
                life: 120 // Frame lifespan before automatic garbage cleanup
            });

            // Fire rate limiter (0.15 seconds gap)
            setTimeout(() => { canFire = true; }, 150);
        }

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.add(p.velocity);
                p.life--;

                // Destroy bullet if it runs out of lifetime frames
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    p.mesh.geometry.dispose();
                    p.mesh.material.dispose();
                    projectiles.splice(i, 1);
                }
            }
        }

        // ==========================================
        // 6. MAIN ENGINE RENDERING HEARTBEAT
        // ==========================================
        function engineLoop() {
            requestAnimationFrame(engineLoop);

            // Execute input frame modifications and projectile steps
            processHardwareControls();
            updateProjectiles();

            // Dynamic Over-The-Shoulder Camera following math
            const targetCamPos = player.position.clone().add(cameraOffset);
            camera.position.lerp(targetCamPos, 0.1); // Smooth camera damping lag
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0))); // Point camera at character's chest area

            // Frame Render Submission
            renderer.render(scene, camera);
        }

        engineLoop();

        // Dynamically recalculate dimensions if browser screen shifts sizes
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
