<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo Divers Ultimate Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050a12; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 30px; left: 30px; color: #00ffcc; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="ui">
        HALO DIVERS ENGINE TEST<br>
        <span id="status" style="color: #ff3366;">⚠️ PRESS THREE-LINES BUTTON (START) TO SWITCH EDGE TO GAME CONTROL MODE</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // 1. HARDWARE-LEVEL CANVAS SETUP
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 2. SANDBOX COMPONENT DATA
        const player = { x: window.innerWidth / 2, y: window.innerHeight / 2, size: 30, color: '#00ffcc', speed: 5 };
        let activeControllerIdx = null;

        // Listen for hardware connections
        window.addEventListener("gamepadconnected", (e) => {
            activeControllerIdx = e.gamepad.index;
            document.getElementById('status').innerText = "✅ Controller Active! Use Left Stick to Move.";
            document.getElementById('status').style.color = "#00ffcc";
        });

        window.addEventListener("gamepaddisconnected", () => {
            activeControllerIdx = null;
            document.getElementById('status').innerText = "❌ Controller Disconnected.";
            document.getElementById('status').style.color = "#ff3366";
        });

        // 3. SECURE SYSTEM RENDERING LOOP
        function engineLoop() {
            // Draw background space grids
            ctx.fillStyle = '#050a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw a decorative background tactical radar circle grid
            ctx.strokeStyle = '#11223a';
            ctx.lineWidth = 2;
            for(let radius = 100; radius < Math.max(canvas.width, canvas.height); radius += 100) {
                ctx.beginPath();
                ctx.arc(canvas.width/2, canvas.height/2, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Read Gamepad Framework Values Safely
            if (activeControllerIdx !== null) {
                const gamepads = navigator.getGamepads();
                const pad = gamepads[activeControllerIdx];

                if (pad && pad.axes) {
                    // Pull indices safely 
                    const axisLeftRight = pad.axes[0] || 0;
                    const axisUpDown = pad.axes[1] || 0;

                    // Apply standard deadzone filtering
                    if (Math.abs(axisLeftRight) > 0.15) player.x += axisLeftRight * player.speed;
                    if (Math.abs(axisUpDown) > 0.15) player.y += axisUpDown * player.speed;

                    // Keep character tracking securely locked inside screen borders
                    if (player.x < 0) player.x = 0;
                    if (player.x > canvas.width) player.x = canvas.width;
                    if (player.y < 0) player.y = 0;
                    if (player.y > canvas.height) player.y = canvas.height;
                }
            }

            // Draw the Player Character (Tactical Combat Crosshair + Block)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
            
            // Outer tactical HUD target ring
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#00ffcc';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size * 1.2, 0, Math.PI * 2);
            ctx.stroke();

            requestAnimationFrame(engineLoop);
        }

        // Initialize Core System Loop
        engineLoop();
    </script>
</body>
</html>
