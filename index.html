<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo Divers Absolute Input Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050a12; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 30px; left: 30px; color: #00ffcc; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="ui">
        HALO DIVERS SECURE CONTROL LAYER<br>
        <span id="status" style="color: #00ffcc;">✅ CONTROLLER HANDSHAKE SUCCESSFUL</span><br>
        <span id="debug" style="color: #8fa0ba; font-size: 16px;">Test stick & ALL buttons now...</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Start player directly in the center
        const player = { x: window.innerWidth / 2, y: window.innerHeight / 2, size: 30, color: '#00ffcc', speed: 7 };

        // GLOBAL INPUT ENGINE
        function processAllInputs() {
            // Grab all active gamepads across every single port
            const gamepads = navigator.getGamepads();
            
            let inputDetected = false;
            let debugText = "No Input Tracked";

            for (let i = 0; i < gamepads.length; i++) {
                const pad = gamepads[i];
                if (!pad) continue;

                // --- 1. THE BRUTE-FORCE LEFT ANALOG STICK SYSTEM ---
                if (pad.axes && pad.axes.length >= 2) {
                    const sX = pad.axes[0];
                    const sY = pad.axes[1];

                    if (Math.abs(sX) > 0.15) { player.x += sX * player.speed; inputDetected = true; }
                    if (Math.abs(sY) > 0.15) { player.y += sY * player.speed; inputDetected = true; }
                    
                    if (Math.abs(sX) > 0.15 || Math.abs(sY) > 0.15) {
                        debugText = `Stick Vector Active: X(${sX.toFixed(2)}) Y(${sY.toFixed(2)})`;
                    }
                }

                // --- 2. THE ABSOLUTE BUTTON OVERRIDE SYSTEM ---
                if (pad.buttons && pad.buttons.length > 0) {
                    
                    // Loop through EVERY button on the Xbox controller to see if ANYTHING is pressed
                    for (let b = 0; b < pad.buttons.length; b++) {
                        if (pad.buttons[b] && pad.buttons[b].pressed) {
                            inputDetected = true;
                            debugText = `Button ID [${b}] is actively pressed!`;

                            // Standard Xbox Console Browser D-Pad Array Mapping
                            if (b === 12) player.y -= player.speed; // D-Pad Up
                            if (b === 13) player.y += player.speed; // D-Pad Down
                            if (b === 14) player.x -= player.speed; // D-Pad Left
                            if (b === 15) player.x += player.speed; // D-Pad Right

                            // Fallback backup mapping if browser treats Left Analog as separate button triggers
                            if (b === 6) player.x -= player.speed;
                            if (b === 7) player.x += player.speed;
                        }
                    }
                }
            }

            // Print diagnostic tracking directly underneath your UI text
            if (inputDetected) {
                document.getElementById('debug').innerText = debugText;
                document.getElementById('debug').style.color = "#00ffcc";
            } else {
                document.getElementById('debug').innerText = "Status: Polling controls... Push sticks hard or spam D-Pad.";
                document.getElementById('debug').style.color = "#8fa0ba";
            }

            // Secure map boundary clip logic
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width) player.x = canvas.width;
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height) player.y = canvas.height;
        }

        // RUNTIME RENDER ENGINE LOOP
        function engineLoop() {
            ctx.fillStyle = '#050a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Tactical Background Radar Rings
            ctx.strokeStyle = '#122138';
            ctx.lineWidth = 2;
            for(let r = 100; r < Math.max(canvas.width, canvas.height); r += 120) {
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Run Input Checks
            processAllInputs();

            // Draw Glowing Player Box Anchor
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);
            
            // Draw Outer HUD Ring
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#00ffcc';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size * 1.3, 0, Math.PI * 2);
            ctx.stroke();

            requestAnimationFrame(engineLoop);
        }

        engineLoop();
    </script>
</body>
</html>
